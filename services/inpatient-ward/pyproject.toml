[project]
name = "zhenhu-inpatient-ward"
version = "0.3.0"  # 阶段J审计修复：版本号统一
description = "臻护 - 通用住院协同服务"
requires-python = ">=3.12"  # 阶段J审计修复：统一 Python 版本
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "zhenhu-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "../../packages/clinical-contracts-py/src",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
