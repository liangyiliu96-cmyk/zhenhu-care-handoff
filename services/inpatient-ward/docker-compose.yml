version: "3.8"

services:
  # ── MySQL 8.0: 业务数据 (zhenhu_workflow) ──
  mysql:
    image: mysql:8.0
    container_name: zhenhu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhenhu_workflow}
      MYSQL_USER: ${MYSQL_USER:-zhenhu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhenhu123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ── Milvus Standalone: 向量检索 (知识库 RAG) ──
  etcd:
    container_name: zhenhu-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: zhenhu-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: zhenhu-milvus
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio

  # ── Redis: Celery 任务队列 + LLM 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: zhenhu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  # ── FastAPI: 住院协同服务 ──
  fastapi:
    build: .
    container_name: zhenhu-fastapi
    restart: unless-stopped
    ports:
      - "${INPATIENT_HOST_PORT:-8001}:8000"
    environment:
      # Phase 1: transactional tables use DATABASE_URL/MySQL, while the
      # single-instance workflow hot state may remain on a durable SQLite volume.
      # Set STORAGE_BACKEND=mysql and remove the opt-in once state_store is migrated.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-sqlite}
      - ALLOW_SQLITE_STATE_STORE=${ALLOW_SQLITE_STATE_STORE:-true}
      - STATE_DB_PATH=/var/lib/zhenhu/zhenhu_state.db
      - DATABASE_URL=mysql+asyncmy://${MYSQL_USER:-zhenhu}:${MYSQL_PASSWORD:-zhenhu123}@mysql:3306/${MYSQL_DATABASE:-zhenhu_workflow}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-zhenhu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-zhenhu123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-zhenhu_workflow}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=deepseek-v4-pro
      # DeepSeek remains primary. Ollama is used only for eligible drafting
      # nodes when the primary provider fails, never for autonomous writes.
      - OLLAMA_FALLBACK_ENABLED=${OLLAMA_FALLBACK_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_FALLBACK_TIMEOUT=${OLLAMA_FALLBACK_TIMEOUT:-45}
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - DOCTOR_AUTO_APPROVE=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
    volumes:
      - state_data:/var/lib/zhenhu

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: zhenhu-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      fastapi:
        condition: service_started
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: zhenhu-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--config.expand-env"]
    environment:
      ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:?Set a critical clinical alert receiver URL}
      ALERTMANAGER_WARNING_WEBHOOK_URL: ${ALERTMANAGER_WARNING_WEBHOOK_URL:?Set a warning clinical alert receiver URL}
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  state_data:
  milvus_data:
