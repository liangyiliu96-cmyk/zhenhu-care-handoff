global:
  resolve_timeout: 5m

route:
  receiver: clinical-warning
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "critical"
      receiver: clinical-critical
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: clinical-warning

receivers:
  - name: clinical-critical
    webhook_configs:
      - url: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL}
        send_resolved: true
  - name: clinical-warning
    webhook_configs:
      - url: ${ALERTMANAGER_WARNING_WEBHOOK_URL}
        send_resolved: true
