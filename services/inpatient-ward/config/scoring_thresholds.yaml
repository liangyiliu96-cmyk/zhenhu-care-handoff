# 臻护临床评分阈值配置 — P2-2
# NHS NEWS2 (National Early Warning Score 2) 阈值表
# 临床参数变更时只需改此文件，无需修改代码
#
# 表结构: [[upper_bound, score], ...]
# float("inf") 用 "inf" 表示
# 查分逻辑: 找到第一个 value <= upper_bound → 取对应 score

news2:
  rr:             # 呼吸频率 (breaths/min)
    - [8, 3]
    - [9, 1]      # 9-11: 1分
    - [11, 1]
    - [20, 0]     # 12-20: 0分 (正常)
    - [24, 2]     # 21-24: 2分
    - ["inf", 3]  # >24: 3分
  spo2_scale1:    # SpO2 标准（非COPD）
    - [91, 3]     # ≤91: 3分
    - [93, 2]     # 92-93: 2分
    - [95, 1]     # 94-95: 1分
    - ["inf", 0]  # ≥96: 0分
  spo2_scale2:    # SpO2 用于COPD患者
    - [83, 3]     # ≤83: 3分
    - [85, 2]     # 84-85: 2分
    - [87, 1]     # 86-87: 1分
    - [92, 0]     # 88-92: 0分 (COPD目标)
  temp:            # 体温 (°C)
    - [35.0, 3]   # ≤35.0: 3分
    - [36.0, 1]   # 35.1-36.0: 1分
    - [38.0, 0]   # 36.1-38.0: 0分
    - [39.0, 1]   # 38.1-39.0: 1分
    - ["inf", 2]  # >39.0: 2分
  sbp:             # 收缩压 (mmHg)
    - [90, 3]     # ≤90: 3分
    - [100, 2]    # 91-100: 2分
    - [110, 1]    # 101-110: 1分
    - [219, 0]    # 111-219: 0分
    - ["inf", 3]  # >219: 3分
  hr:              # 心率 (bpm)
    - [40, 3]     # ≤40: 3分
    - [50, 1]     # 41-50: 1分
    - [90, 0]     # 51-90: 0分
    - [110, 1]    # 91-110: 1分
    - [130, 2]    # 111-130: 2分
    - ["inf", 3]  # >130: 3分

# qSOFA 脓毒症筛查阈值
qsofa:
  rr_threshold: 22       # 呼吸频率 ≥22 → 1分
  sbp_threshold: 100     # 收缩压 ≤100 → 1分
  gcs_threshold: 15      # GCS <15 → 1分
