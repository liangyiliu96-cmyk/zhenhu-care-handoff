# Alembic migration configuration -- fhir-adapter service
#
# Database URL is provided via the DATABASE_URL environment variable
# (consistent with models.py):
#   - unset: falls back to models.py SQLite test database
#   - production (APP_ENV=production or DATABASE_URL is mysql): migrations are
#     run programmatically via alembic.command.upgrade in main.py lifespan
# sqlalchemy.url is injected dynamically by migrations/env.py.

[alembic]
script_location = migrations

# prepend_sys_path keeps CLI runs working when invoked from the service root.
# env.py additionally inserts absolute paths for src/ and zhenhu-contracts.
prepend_sys_path = .

# Do not hardcode the DB url here (avoids leaking credentials).
sqlalchemy.url =

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
