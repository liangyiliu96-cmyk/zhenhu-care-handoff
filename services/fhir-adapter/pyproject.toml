[project]
name = "zhenhu-fhir"
version = "0.2.0"
description = "臻护 AI 协同平台 — FHIR 适配服务：患者资源管理、脱敏输出、访问审计"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "zhenhu-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "../../packages/clinical-contracts-py/src",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
