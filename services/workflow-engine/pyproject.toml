[project]
name = "zhenhu-workflow"
version = "0.2.0"
description = "臻护 AI 协同平台 — 病例协同工作流引擎：状态机 + Agent 编排 + 审核流"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "zhenhu-contracts",
    "asyncmy>=0.2.10",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "../../packages/clinical-contracts-py/src",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
