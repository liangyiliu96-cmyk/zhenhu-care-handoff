[project]
name = "zhenhu-knowledge"
version = "0.2.0"
description = "臻护 AI 协同平台 — 知识管理与编排服务：文档导入、状态机、混合检索、反向阻断钩子"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "zhenhu-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "../../packages/clinical-contracts-py/src",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
