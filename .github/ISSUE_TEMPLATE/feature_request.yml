name: 功能请求
description: 建议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 痛点
      description: 你想解决什么问题?面向哪些用户场景?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案设想
      description: 期望的行为、界面或接口变化。
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 前端
        - label: 后端服务
        - label: 数据/检索
        - label: 部署/运维
