# 臻护 · 全病程数智医护平台 — 全栈编排
# 用法:
#   docker compose up -d                     # 完整栈 (MySQL + Redis + 4 后端 + 前端)
#   docker compose up -d --build             # 重新构建镜像
#   docker compose --profile monitoring up -d # 额外启用 Prometheus + Alertmanager
#   docker compose down                      # 停止 (加 -v 清空数据卷)

name: zhenhu

services:
  # ═══════════════ 基础设施 ═══════════════
  mysql:
    image: mysql:8.0
    container_name: zhenhu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zhenhu_root}
      MYSQL_DATABASE: zhenhu_workflow
      MYSQL_USER: ${MYSQL_USER:-zhenhu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhenhu123}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: zhenhu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:latest
    container_name: zhenhu-neo4j
    restart: unless-stopped
    environment:
      # 证据图谱图数据库; 生产建议固定版本 tag 并修改密码
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Milvus Standalone 三件套: etcd(元数据) + minio(对象存储) + milvus(向量库)
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: zhenhu-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: zhenhu-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  milvus:
    image: milvusdb/milvus:v2.6.1
    container_name: zhenhu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: zhenhu-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_HTTP_PORT: "8080"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/zhenhu"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════ 后端服务 ═══════════════
  workflow-engine:
    build:
      context: .
      dockerfile: services/workflow-engine/Dockerfile
    container_name: zhenhu-workflow-engine
    restart: unless-stopped
    ports:
      - "${WORKFLOW_HOST_PORT:-8100}:8100"
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-zhenhu}:${MYSQL_PASSWORD:-zhenhu123}@mysql:3306/zhenhu_workflow
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://keycloak:8080/realms/zhenhu}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/zhenhu/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-zhenhu-web}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  knowledge-orchestrator:
    build:
      context: .
      dockerfile: services/knowledge-orchestrator/Dockerfile
    container_name: zhenhu-knowledge
    restart: unless-stopped
    ports:
      - "${KNOWLEDGE_HOST_PORT:-8200}:8200"
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-zhenhu}:${MYSQL_PASSWORD:-zhenhu123}@mysql:3306/zhenhu_knowledge
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://keycloak:8080/realms/zhenhu}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/zhenhu/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-zhenhu-web}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  fhir-adapter:
    build:
      context: .
      dockerfile: services/fhir-adapter/Dockerfile
    container_name: zhenhu-fhir
    restart: unless-stopped
    ports:
      - "${FHIR_HOST_PORT:-8300}:8300"
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-zhenhu}:${MYSQL_PASSWORD:-zhenhu123}@mysql:3306/zhenhu_fhir
      KNOWLEDGE_URL: http://knowledge-orchestrator:8200
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://keycloak:8080/realms/zhenhu}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/zhenhu/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-zhenhu-web}
    depends_on:
      mysql:
        condition: service_healthy
      knowledge-orchestrator:
        condition: service_started

  inpatient-ward:
    build:
      context: .
      dockerfile: services/inpatient-ward/Dockerfile
    container_name: zhenhu-inpatient
    restart: unless-stopped
    ports:
      - "${INPATIENT_HOST_PORT:-8001}:8000"
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-zhenhu}:${MYSQL_PASSWORD:-zhenhu123}@mysql:3306/zhenhu_workflow
      REDIS_URL: redis://redis:6379/0
      FHIR_URL: http://fhir-adapter:8300
      KNOWLEDGE_URL: http://knowledge-orchestrator:8200
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_MODEL_PRO: ${DEEPSEEK_MODEL_PRO:-deepseek-chat}
      STATE_DB_PATH: /var/lib/zhenhu/zhenhu_state.db
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DOCTOR_AUTO_APPROVE: ${DOCTOR_AUTO_APPROVE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://keycloak:8080/realms/zhenhu}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/zhenhu/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-zhenhu-web}
      OLLAMA_FALLBACK_ENABLED: ${OLLAMA_FALLBACK_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ALLOW_SQLITE_STATE_STORE: ${ALLOW_SQLITE_STATE_STORE:-true}
      STATE_TTL_SECONDS: ${STATE_TTL_SECONDS:-1800}
      # Neo4j 证据图谱 (容器内 host=neo4j; 默认对齐演示容器 neo4j/password)
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - state_data:/var/lib/zhenhu
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      fhir-adapter:
        condition: service_started
      knowledge-orchestrator:
        condition: service_started

  # ═══════════════ 前端 ═══════════════
  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    container_name: zhenhu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - inpatient-ward

  # ═══════════════ 监控 (可选 profile) ═══════════════
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: zhenhu-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./services/inpatient-ward/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/inpatient-ward/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - workflow-engine
      - knowledge-orchestrator
      - fhir-adapter
      - inpatient-ward

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    container_name: zhenhu-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--config.expand-env"]
    environment:
      # 生产环境务必在 .env 中配置真实 webhook 接收地址, 否则告警发送到占位地址
      ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://127.0.0.1:9099/zhenhu-critical}
      ALERTMANAGER_WARNING_WEBHOOK_URL: ${ALERTMANAGER_WARNING_WEBHOOK_URL:-http://127.0.0.1:9099/zhenhu-warning}
    ports:
      - "9093:9093"
    volumes:
      - ./services/inpatient-ward/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
  state_data:
  etcd_data:
  minio_data:
  milvus_data:
  keycloak_data:
  neo4j_data:
