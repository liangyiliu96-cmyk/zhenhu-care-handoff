# 臻护前端 Nginx 配置: 静态托管 + API 反向代理
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 响应头安全基线
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理 → inpatient-ward (宿主机入口 8001:8000)
    # resolver + 变量形式: 每次请求动态解析上游, 后端容器重建后不会因 IP 缓存导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_inpatient http://inpatient-ward:8000;
    location ~ ^/(inpatient|ward|assistant|monitoring|patients|cds-services|admin|nurse)(/|$) {
        proxy_pass $upstream_inpatient;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
